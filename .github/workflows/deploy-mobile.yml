name: Build & Submit Mobile (EAS)

# Build + submission de l'app mobile sur EAS, puis upload aux stores.
# - profile=preview → TestFlight External + Play Open Testing (default)
# - profile=production → release App Store / Play Production
#
# Les URLs Convex prod (NEXT_PUBLIC_CONVEX_URL / CONVEX_SITE_URL) sont
# lues depuis les GitHub Secrets et propagées au build EAS via
# `eas env:create --scope project` (synchro idempotente — ne renvoie une
# erreur que si la valeur change, ce qui est traité avec --force).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS profile (preview | production)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      platform:
        description: "Plateforme à builder"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: "Submit aux stores après build"
        required: true
        default: true
        type: boolean
      skip_build:
        description: "Skip le build (réutilise le dernier build EAS, juste submit)"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "mobile-v*.*.*"

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Les builds iOS locaux évitent le quota EAS et utilisent un Xcode stable,
    # exigé par App Store Connect. Android et les builds multi-plateformes
    # continuent d'utiliser le service EAS distant depuis Linux.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS CLI
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun add -g eas-cli@21.1.0

      - name: Sync Convex env vars to EAS project
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
        run: |
          # Idempotent : ré-écrit la valeur si elle a changé ; ne crash
          # pas si l'env existe déjà avec la même valeur.
          eas env:create \
            --scope project \
            --environment preview \
            --environment production \
            --visibility plaintext \
            --name EXPO_PUBLIC_CONVEX_URL \
            --value "$NEXT_PUBLIC_CONVEX_URL" \
            --force --non-interactive
          eas env:create \
            --scope project \
            --environment preview \
            --environment production \
            --visibility plaintext \
            --name EXPO_PUBLIC_CONVEX_SITE_URL \
            --value "$CONVEX_SITE_URL" \
            --force --non-interactive

      - name: Restore Google Play service account
        if: ${{ inputs.platform != 'ios' }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          mkdir -p apps/mobile/credentials
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" ]; then
            echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" | base64 -d > apps/mobile/credentials/play-service-account.json
          fi

      - name: EAS Build (iOS local)
        if: ${{ inputs.skip_build != true && inputs.platform == 'ios' }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile "${{ inputs.profile || 'preview' }}" \
            --platform ios \
            --local \
            --output "$RUNNER_TEMP/identite-ga.ipa" \
            --non-interactive

      - name: EAS Build (remote)
        if: ${{ inputs.skip_build != true && inputs.platform != 'ios' }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile "${{ inputs.profile || 'preview' }}" \
            --platform "${{ inputs.platform || 'all' }}" \
            --non-interactive

      - name: Verify OTA configuration in iOS binary
        if: ${{ inputs.skip_build != true && inputs.platform == 'ios' }}
        env:
          BUILD_PROFILE: ${{ inputs.profile || 'preview' }}
        run: |
          python3 apps/mobile/scripts/verify-ipa-updates.py \
            "$RUNNER_TEMP/identite-ga.ipa" "$BUILD_PROFILE" "$RUNNER_TEMP/mobile-build.json"
          echo '### Configuration Expo du binaire iOS' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/mobile-build.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.skip_build != true && inputs.platform == 'ios' }}
        with:
          name: mobile-build-${{ inputs.profile || 'preview' }}-${{ github.sha }}
          path: ${{ runner.temp }}/mobile-build.json

      - name: EAS Submit (iOS local)
        if: ${{ inputs.submit != false && inputs.platform == 'ios' && inputs.skip_build != true }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --profile "${{ inputs.profile || 'preview' }}" \
            --platform ios \
            --path "$RUNNER_TEMP/identite-ga.ipa" \
            --non-interactive

      - name: EAS Submit (latest remote build)
        if: ${{ inputs.submit != false && (inputs.platform != 'ios' || inputs.skip_build == true) }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          eas submit \
            --profile "${{ inputs.profile || 'preview' }}" \
            --platform "${{ inputs.platform || 'all' }}" \
            --latest \
            --non-interactive
