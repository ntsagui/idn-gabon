name: Publish Mobile Update (Expo)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal destinataire (preview = TestFlight)"
        type: choice
        options: [preview, production]
        default: preview
        required: true
      platform:
        description: "Plateforme"
        type: choice
        options: [ios, android, all]
        default: ios
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-update-${{ inputs.channel || 'preview' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      UPDATE_CHANNEL: ${{ inputs.channel || 'preview' }}
      UPDATE_PLATFORM: ${{ inputs.platform || 'ios' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Check mobile code
        run: bun run --cwd apps/mobile typecheck && bun run --cwd apps/mobile test
      - name: Install EAS CLI
        run: bun add -g eas-cli@21.1.0
      - name: Publish compatible update
        working-directory: apps/mobile
        run: |
          eas update --channel "$UPDATE_CHANNEL" \
            --environment "$UPDATE_CHANNEL" \
            --platform "$UPDATE_PLATFORM" \
            --message "Mobile ${GITHUB_SHA}" \
            --emit-metadata --json --non-interactive > update-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: expo-update-${{ env.UPDATE_CHANNEL }}-${{ github.sha }}
          path: |
            apps/mobile/update-result.json
            apps/mobile/dist/eas-update-metadata.json
      - name: Deployment record
        run: |
          echo '### Expo Update' >> "$GITHUB_STEP_SUMMARY"
          echo "Canal : $UPDATE_CHANNEL · commit : $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Seules les applications ayant le même runtime natif reçoivent cette mise à jour. Un changement natif nécessite un nouveau build.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat apps/mobile/update-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
